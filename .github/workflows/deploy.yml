name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.73.0
  HUGO_ARCHIVE_SHA_256: 7238b1b39d50667190020c93370bb2727d9097226cb3147c982d4d40004da09f
  HUGO_THEME: batmat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install asciidoctor
        run: |
          sudo apt-get update -y
          sudo apt-get install -y asciidoctor
          asciidoctor --version

      - name: Install pinned Hugo
        run: |
          curl -sSfL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_Linux-64bit.tar.gz" -o hugo.tar.gz
          echo "${HUGO_ARCHIVE_SHA_256}  hugo.tar.gz" | sha256sum --check
          tar xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          rm -f hugo hugo.tar.gz
          hugo version

      - uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc

      - name: Sanity-check the output
        run: |
          test -s public/index.html
          test -s public/CNAME
          test -s public/404.html
          test -s public/index.xml
          echo "pages built: $(find public -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
