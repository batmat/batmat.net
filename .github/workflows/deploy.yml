name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  HUGO_ARCHIVE_SHA_256: 45228f5a52eb118b0ca168068f01d7df0447314a24056f1d29667ed9fc368308
  HUGO_THEME: batmat

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install asciidoctor
        run: |
          sudo apt-get update -y
          sudo apt-get install -y asciidoctor
          asciidoctor --version

      - name: Install pinned Hugo
        run: |
          curl -sSfL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          echo "${HUGO_ARCHIVE_SHA_256}  hugo.tar.gz" | sha256sum --check
          tar xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          rm -f hugo hugo.tar.gz
          hugo version

      - uses: actions/configure-pages@v6

      - name: Build
        run: hugo --gc

      - name: Sanity-check the output
        run: |
          test -s public/index.html
          test -s public/CNAME
          test -s public/404.html
          test -s public/index.xml
          echo "pages built: $(find public -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
