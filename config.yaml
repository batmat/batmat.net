baseurl: "https://batmat.net"
title: "batmat.net"
params:
  Description: "Blogounage"
  Id: "Bimbimbim"
  Author: "Baptiste Mathus"
locale: "fr-FR"
permalinks:
  post: /:year/:month/:day/:slug/
enableEmoji: true

# Hugo started title-casing list/taxonomy titles by default in 0.123.0. The tag
# pages listed their terms lowercase before, so keep that.
capitalizeListTitles: false

# Hugo shells out to the external asciidoctor binary to render the 25
# .adoc/.asciidoc files. It is not in Hugo's default exec allowlist, and
# setting this key replaces the default rather than extending it, so the
# built-in entries have to be restated here.
security:
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^asciidoctor$
